name: Build e release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bleak pytest
      - run: python -m pytest -q

  macos:
    # App nativa para Mac (SwiftUI + Liquid Glass). Compila e testa sempre;
    # o .zip fica nos artefactos de cada execução para experimentar.
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Usar o Xcode 26 (SDK do macOS 26, para o Liquid Glass)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: sed -i '' "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" iqos_monitor/version.py
      - run: swift --version
      - run: swift test
      - run: ./build-app.sh
      - name: Capturas de ecrã (modo de simulação)
        continue-on-error: true
        run: |
          mkdir -p build/screens
          for mode in Light Dark; do
            if [ "$mode" = Dark ]; then defaults write -g AppleInterfaceStyle Dark; else defaults delete -g AppleInterfaceStyle 2>/dev/null || true; fi
            open -n build/IqosMonitor.app --args --demo
            sleep 25
            screencapture -x "build/screens/$mode.png"
            pkill -x IqosMonitor || true
            sleep 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: IqosMonitor-macOS
          path: |
            macos/build/IqosMonitor-macOS.zip
            macos/build/screens/
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Espera que a release exista (é criada pelo job do Windows ou na página do GitHub).
          for i in $(seq 1 60); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          shasum -a 256 build/IqosMonitor-macOS.zip | cut -d' ' -f1 > build/IqosMonitor-macOS.zip.sha256
          gh release upload "$GITHUB_REF_NAME" build/IqosMonitor-macOS.zip build/IqosMonitor-macOS.zip.sha256 --clobber

  release:
    # Cada tag vX.Y.Z gera o .exe e publica a release que a app instala sozinha.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escrever a versão a partir da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" iqos_monitor/version.py
          sed -i "s|^GITHUB_REPO = .*|GITHUB_REPO = \"$GITHUB_REPOSITORY\"|" iqos_monitor/version.py
          cat iqos_monitor/version.py
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name IqosMonitor --icon assets/icon.ico run.py
      - name: SHA-256
        run: |
          cd dist
          sha256sum IqosMonitor.exe | cut -d' ' -f1 > IqosMonitor.exe.sha256
          cat IqosMonitor.exe.sha256
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release pode já existir quando é criada na página do GitHub.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/IqosMonitor.exe dist/IqosMonitor.exe.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/IqosMonitor.exe dist/IqosMonitor.exe.sha256 \
              --title "IQOS Monitor $GITHUB_REF_NAME" --generate-notes
          fi
